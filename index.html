<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squid Game &#183; Luz Verde, Luz Roja</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="style.css?v=18">
</head>
<body>



<div class="stage" id="stage">
  <canvas id="game"></canvas>
  <button id="soundBtn" class="corner-btn" title="Sonido"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.2 8.6a4.8 4.8 0 010 6.8M18.6 6.2a8.2 8.2 0 010 11.6" fill="none" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  <button id="exitBtn" class="exit-btn" title="Salir del juego">&#10005;</button>

  <div id="invite" class="overlay">
    <div class="inv-wrap">
      <div class="invitation" id="invitationCard" role="button" tabindex="0">
        <img src="assets/images/invitation.gif" alt="Tarjeta de invitaci&#243;n al juego">
      </div>
      <div class="inv-load"><div class="load-bar"><div id="loadFill"></div></div><span id="loadPct">0%</span></div>
      <div class="inv-hint" id="invHint">Cargando recursos&#8230;</div>
    </div>
  </div>

  <div id="endOverlay" class="overlay hidden">
    <div class="end-box">
      <div id="endTitle" class="end-title"></div>
      <p id="endMsg" class="end-msg"></p>
      <div class="btn-row">
        <button id="retryBtn" class="btn btn-primary">Jugar de nuevo</button>
        <button id="shareBtn" class="btn btn-ghost">Compartir</button>
        <button id="backBtn" class="btn btn-ghost">Invitaci&#243;n</button>
      </div>
    </div>
  </div>
</div>

<div class="controls">
  <button id="btnGo" class="pad go" disabled aria-label="Avanzar"><img id="goImg" src="assets/images/sprites/go1.png" alt=""></button>
</div>

<div class="hud">
      <span id="phaseChip" class="chip">&#9209; En espera</span>
      <span class="chip">Vivos: <b id="aliveCount">6</b>/6</span>
      <span class="chip">Meta: <b id="crossedCount">0</b>/6</span>
    </div>



<script src="game.js?v=18"></script>
</body>
</html>
