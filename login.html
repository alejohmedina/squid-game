<!DOCTYPE html>
<html lang="es">
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background-color: transparent; 
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh; 
        margin: 0;
        padding: 5px; 
        box-sizing: border-box;
        color: #f8fafc;
      }
      .card {
        background: #1e293b;
        padding: 20px;
        border-radius: 16px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 340px;
        text-align: center;
        border: 1px solid #334155;
        box-sizing: border-box; 
      }
      
      .icon-container {
        background: #0f172a;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0 auto 10px auto;
        border: 1px solid #334155;
      }
      .icon-container svg { width: 20px; height: 20px; fill: #e50914; }
      
      h2 { margin: 0 0 2px 0; font-size: 18px; font-weight: 600; }
      .subtitle { color: #94a3b8; font-size: 12px; margin-bottom: 15px; margin-top: 0; }

      .input-group { position: relative; margin-bottom: 10px; text-align: left; }
      .input-group svg {
        position: absolute; left: 10px; top: 50%;
        transform: translateY(-50%); width: 16px; height: 16px; fill: #64748b;
        transition: fill 0.3s ease;
      }
      input {
        width: 100%; padding: 10px 10px 10px 34px;
        background: #0f172a; border: 1px solid #334155; border-radius: 8px;
        box-sizing: border-box; font-size: 14px; color: #f8fafc;
        transition: all 0.3s ease; font-family: inherit;
      }
      input:focus { outline: none; border-color: #e50914; box-shadow: 0 0 0 2px rgba(229, 9, 20, 0.15); }
      input::placeholder { color: #475569; }
      .input-group:focus-within svg { fill: #e50914; }

      button {
        background: linear-gradient(135deg, #e50914 0%, #b20710 100%);
        color: white; border: none; padding: 10px; width: 100%;
        border-radius: 8px; font-size: 14px; font-weight: 600;
        cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; margin-top: 5px;
      }
      button:hover { transform: translateY(-2px); box-shadow: 0 5px 10px -3px rgba(229, 9, 20, 0.3); }
      button:disabled { background: #334155; color: #64748b; cursor: not-allowed; transform: none; box-shadow: none; }

      #resultado { margin-top: 15px; }
      .otp-box {
        background: #0f172a; border: 1px dashed #475569; border-radius: 8px;
        padding: 10px 5px; margin: 10px 0; position: relative;
      }
      .codigo-otp {
        font-size: 28px;
        font-family: 'Courier New', Courier, monospace;
        font-weight: 700; letter-spacing: 8px; color: #ef4444;
        margin: 0; padding-left: 8px;
      }
      .fecha { font-size: 11px; color: #64748b; }
      .mensaje-error { 
        color: #f87171; font-size: 12px; background: rgba(248, 113, 113, 0.1);
        padding: 8px; border-radius: 6px; display: inline-block;
      }

      .cargando {
        display: none; margin: 10px auto; border: 2px solid #334155;
        border-top: 2px solid #e50914; border-radius: 50%; width: 20px; height: 20px;
        animation: girar 1s linear infinite;
      }
      @keyframes girar { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

      /* --- ESTILOS DE LA INVITACI+攓 AL JUEGO --- */
      .invite-card {
        margin-top: 20px; cursor: pointer;
        background: #0f172a; border: 1px solid #334155; border-radius: 12px;
        padding: 10px; transition: transform .2s, box-shadow .2s, border-color .2s;
      }
      .invite-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px -5px rgba(229, 9, 20, 0.3); border-color: #e50914; }
      .invite-card img { width: 100%; height: auto; border-radius: 8px; display: block; }

      /* --- ESTILOS DEL MODAL DEL JUEGO --- */
      .game-modal { 
        position: fixed; inset: 0; z-index: 9999; display: none; 
        /* Cambio clave: Alinear arriba en lugar de centrar */
        align-items: flex-start; 
        justify-content: center; 
        background: rgba(0,0,0,0.92);
        padding-top: 15px; /* Margen para que respire */
        box-sizing: border-box;
      }
      .game-modal.open { display: flex; }
      .game-modal iframe { 
        width: min(560px, 94vw, 70vh); 
        height: calc(min(560px, 94vw, 70vh) * 1.58); 
        border: none; border-radius: 12px; 
        box-shadow: 0 25px 80px rgba(0,0,0,.7); background: #12101c; 
      }
      .game-close { 
        position: absolute; top: 15px; right: 15px; z-index: 10000; 
        width: 36px; height: 36px; border-radius: 50%; 
        border: 1px solid rgba(255,255,255,.35); background: rgba(10,8,18,.7); 
        color: #fff; font-size: 18px; cursor: pointer; display: flex; 
        align-items: center; justify-content: center; transition: all .2s; 
      }
      .game-close:hover { background: #e50914; border-color: #e50914; transform: rotate(90deg); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-container">
        <svg viewBox="0 0 24 24">
          <path d="M12 17a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6-9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2h1V6a5 5 0 0 1 10 0v2h1zm-6-5a3 3 0 0 0-3 3v2h6V6a3 3 0 0 0-3-3z"/>
        </svg>
      </div>

      <h2>Portal de Acceso</h2>
      <p class="subtitle">Visor de c+圬igos OTP</p>

      <form id="formulario" onsubmit="procesarFormulario(event)">
        <div class="input-group">
          <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
          <input type="email" id="inputCorreo" placeholder="Correo electr+好ico" required autocomplete="off">
        </div>

        <div class="input-group">
          <svg viewBox="0 0 24 24"><path d="M12.65 10A5.99 5.99 0 0 0 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6a5.99 5.99 0 0 0 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
          <input type="password" id="inputClave" placeholder="Contrase+地 de acceso" required>
        </div>
        
        <button type="submit" id="btnBuscar">Consultar base de datos</button>
      </form>
      
      <div class="cargando" id="animacionCarga"></div>
      <div id="resultado"></div>

      <!-- Tarjeta de invitaci+好 al juego -->
      <div class="invite-card" id="inviteCard" role="button" tabindex="0" aria-label="Abrir juego">
        <img src="https://alejohmedina.github.io/squid-game/assets/images/invitation.gif" alt="Tarjeta de invitaci+好 al juego">
      </div>
    </div>

    <!-- Modal overlay con el juego -->
    <div class="game-modal" id="gameModal" role="dialog" aria-modal="true">
      <button class="game-close" id="gameClose" aria-label="Cerrar juego">&times;</button>
      <iframe id="gameFrame" src="https://alejohmedina.github.io/squid-game/" allowfullscreen></iframe>
    </div>

    <script>
      function procesarFormulario(evento) {
        evento.preventDefault(); 
        const correo = document.getElementById('inputCorreo').value;
        const clave = document.getElementById('inputClave').value;
        const divResultado = document.getElementById('resultado');
        const animacion = document.getElementById('animacionCarga');
        const boton = document.getElementById('btnBuscar');

        const cantidadLetras = (clave.match(/[a-zA-Z]/g) || []).length;
        const cantidadNumeros = (clave.match(/[0-9]/g) || []).length;
        if (clave.length !== 5 || cantidadLetras !== 3 || cantidadNumeros !== 2) {
          divResultado.innerHTML = `<div class="mensaje-error">Formato incorrecto. Usa 3 letras y 2 n+妃eros.</div>`;
          return; 
        }

        divResultado.innerHTML = '';
        animacion.style.display = 'block';
        boton.disabled = true;

        google.script.run
          .withSuccessHandler(function(respuesta) {
            animacion.style.display = 'none';
            boton.disabled = false;
            if (respuesta.error) {
              divResultado.innerHTML = `<div class="mensaje-error">${respuesta.error}</div>`;
            } else {
              divResultado.innerHTML = `
                <div style="color: #94a3b8; font-size: 11px;">+釿timo c+圬igo detectado:</div>
                <div class="otp-box">
                  <div class="codigo-otp">${respuesta.otp}</div>
                </div>
                <div class="fecha">Recibido el ${respuesta.fecha}</div>
              `;
            }
          })
          .withFailureHandler(function(error) {
            animacion.style.display = 'none';
            boton.disabled = false;
            divResultado.innerHTML = `<div class="mensaje-error">Error: ${error.message}</div>`;
          })
          .obtenerUltimoOTP(correo, clave); 
      }

      // --- L+廯ICA DEL MODAL DEL JUEGO ---
      (function() {
        const modal = document.getElementById('gameModal');
        const frame = document.getElementById('gameFrame');
        const closeBtn = document.getElementById('gameClose');
        const invite = document.getElementById('inviteCard');

        function openGame() {
          modal.classList.add('open');
          document.body.style.overflow = 'hidden'; 
          frame.focus();
        }
        function closeGame() {
          modal.classList.remove('open');
          document.body.style.overflow = '';
          frame.src = frame.src; 
        }

        invite.addEventListener('click', openGame);
        invite.addEventListener('keydown', function(e) {
          if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); openGame(); }
        });
        closeBtn.addEventListener('click', closeGame);
        modal.addEventListener('click', function(e) {
          if (e.target === modal) closeGame(); 
        });
        document.addEventListener('keydown', function(e) {
          if (e.code === 'Escape' && modal.classList.contains('open')) closeGame();
        });
      })();
    </script>
  </body>
</html>
